# .gitlab-ci.yml for Maven Library Components
#
# Simplified pipeline for shared libraries that only need:
# - Version calculation
# - Maven build and test
# - Nexus deployment

include:
  - project: 'redacted-/platform/doe-deployment'
    ref: main
    file: "main.yml"

variables:
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  REVISION: "0.0.1"
  CHANGELIST: ""
  FULL_VERSION: ""

stages:
  - .pre
  - validate
  - build
  - .post

# Calculate version (same as microservices)
calculate-version:
  stage: .pre
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - |
      export REVISION="0.0.1"
      
      if [ "${CI_COMMIT_REF_NAME}" = "main" ]; then
        export CHANGELIST="-SNAPSHOT"
      elif [ -n "${CI_MERGE_REQUEST_IID}" ]; then
        export CHANGELIST="-SNAPSHOT-MR${CI_MERGE_REQUEST_IID}"
      elif [ "${CI_COMMIT_TAG}" ]; then
        export CHANGELIST=""
        export REVISION="${CI_COMMIT_TAG#v}"
      else
        BRANCH_SLUG=$(echo "${CI_COMMIT_REF_SLUG}" | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-30)
        USER_SLUG=$(echo "${GITLAB_USER_LOGIN}" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-15)
        export CHANGELIST="-SNAPSHOT-${USER_SLUG}-${BRANCH_SLUG}"
      fi
      
      export FULL_VERSION="${REVISION}${CHANGELIST}"
      
      echo "REVISION=${REVISION}" >> build.env
      echo "CHANGELIST=${CHANGELIST}" >> build.env
      echo "FULL_VERSION=${FULL_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

# Validate POM
validate-pom:
  stage: validate
  image: maven:3.9-eclipse-temurin-21
  needs:
    - calculate-version
  script:
    - |
      mvn ${MAVEN_CLI_OPTS} validate \
        -Drevision=${REVISION} \
        -Dchangelist=${CHANGELIST}

# Build and test
maven-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs:
    - calculate-version
    - validate-pom
  script:
    - |
      mvn ${MAVEN_CLI_OPTS} clean install \
        -Drevision=${REVISION} \
        -Dchangelist=${CHANGELIST}
  artifacts:
    paths:
      - target/*.jar
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

# Deploy to Nexus
maven-deploy:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs:
    - maven-build
  script:
    - |
      mvn ${MAVEN_CLI_OPTS} deploy \
        -Drevision=${REVISION} \
        -Dchangelist=${CHANGELIST} \
        -DskipTests=true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
    policy: pull
  only:
    - main
    - merge_requests
    - tags
